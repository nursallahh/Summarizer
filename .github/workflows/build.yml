name: Build and test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  data-check:
    name: Data protection check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every file in the repository
        run: git ls-files -z | xargs -0 sh tools/check-data.sh

  windows:
    name: Windows build (core + cli)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set vcpkg path
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows-release -DDA_COPY_TO_UNITY=OFF

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Run the command-line tool
        run: .\build\windows-release\bin\Release\summarizer.exe --info
